name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: mainnet
            target: firefox
          - network: mainnet
            target: chrome
          - network: testnet
            target: chrome
          - network: testnet
            target: firefox
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for ${{ matrix.target }} ${{ matrix.network }}
        run: pnpm run build:${{ matrix.network }}:${{ matrix.target }}

      - name: Package CRX
        if: matrix.target == 'chrome'
        run: |
          # Install the packager
          npm install -g crx3
          
          # 1. Generate a temporary private key for signing
          openssl genrsa -out temp_key.pem 2048
          
          # 2. Pack the 'dist' folder into a .crx file
          # We enable the legacy provider for Node 20+ compatibility
          export NODE_OPTIONS=--openssl-legacy-provider
          crx3 dist -p temp_key.pem -o nautilus-${{ matrix.network }}-${{ matrix.target }}.crx
          
          # 3. Clean up the key
          rm temp_key.pem

      - name: Zip build
        run: |
          cd dist
          zip -r ../nautilus-${{ matrix.network }}-${{ matrix.target }}.zip .
          cd ..

      - name: Upload Release Assets
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.crx

      - name: Upload Artifacts
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: nautilus-${{ matrix.network }}-${{ matrix.target }}
          path: |
            *.zip
            *.crx
